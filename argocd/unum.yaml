apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unum
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/danielriddell21/riddellious-dev
    targetRevision: trunk
    path: manifests/unum
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: unum
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
