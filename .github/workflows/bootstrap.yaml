name: Bootstrap cluster

# One-time setup: installs ArgoCD and creates the cloudflared-token secret.
# Run after terraform apply has completed and the server is reachable.

on:
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  TF_VAR_hetzner_token: ${{ secrets.HETZNER_TOKEN }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_domain: 'riddellious.dev'

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          terraform_wrapper: false

      - name: Read Terraform outputs
        id: tf
        working-directory: terraform
        run: |
          terraform init -backend-config=backend.hcl
          echo "server_ip=$(terraform output -raw server_ip)" >> "$GITHUB_OUTPUT"
          echo "tunnel_token=$(terraform output -raw tunnel_token)" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Wait for k3s
        run: |
          SERVER=${{ steps.tf.outputs.server_ip }}
          echo "Waiting for k3s on $SERVER..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                root@"$SERVER" 'systemctl is-active k3s' 2>/dev/null | grep -q active; then
              echo "k3s active after attempt $i"
              exit 0
            fi
            echo "Attempt $i/30 — retrying in 10s..."
            sleep 10
          done
          echo "Timed out waiting for k3s" >&2
          exit 1

      - name: Fetch kubeconfig
        run: |
          SERVER=${{ steps.tf.outputs.server_ip }}
          mkdir -p ~/.kube
          ssh -o StrictHostKeyChecking=no root@"$SERVER" \
            'cat /etc/rancher/k3s/k3s.yaml' \
            | sed "s/127\.0\.0\.1/$SERVER/g" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Bootstrap
        env:
          TUNNEL_TOKEN: ${{ steps.tf.outputs.tunnel_token }}
        run: |
          kubectl create namespace unum  --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic cloudflared-token \
            --from-literal=token="$TUNNEL_TOKEN" \
            --namespace unum \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

          echo "Waiting for argocd-server..."
          kubectl wait --for=condition=available deployment/argocd-server \
            -n argocd --timeout=300s

          kubectl apply -f argocd/application.yaml

      - name: ArgoCD initial password
        run: |
          echo "ArgoCD admin password:"
          kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath="{.data.password}" | base64 -d
          echo
