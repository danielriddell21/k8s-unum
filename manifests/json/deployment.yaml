apiVersion: apps/v1
kind: Deployment
metadata:
  name: unum-json
  namespace: unum
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: unum-json
  template:
    metadata:
      labels:
        app: unum-json
    spec:
      containers:
        - name: unum-json
          image: ghcr.io/danielriddell21/unum:v1.1.0
          args: ["json", "--web"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: XDG_CONFIG_HOME
              value: /etc
          volumeMounts:
            - name: unum-config
              mountPath: /etc/unum
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: unum-config
          configMap:
            name: unum-config
