apiVersion: v1
kind: ConfigMap
metadata:
  name: umami-proxy-config
  namespace: platform
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # umami-sso handles the OIDC login/logout flow (incl. /login/callback)
        location /login {
          proxy_pass http://umami-sso:8000;
        }
        location /logout {
          proxy_pass http://umami-sso:8000;
        }

        # everything else is Umami itself
        location / {
          proxy_pass http://umami:3000;
        }
      }
    }
