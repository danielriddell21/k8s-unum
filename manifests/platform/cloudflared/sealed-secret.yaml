# PLACEHOLDER — reseal before/at deploy: `just seal-secrets` → cloudflared-platform
# (reads platform_tunnel_token from Terraform state). Until resealed, the
# SealedSecrets controller cannot decrypt this and the cloudflared pod
# CrashLoops with secret-not-found. See docs/secrets.md.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflared-token
  namespace: platform
spec:
  encryptedData:
    token: PLACEHOLDER
  template:
    metadata:
      name: cloudflared-token
      namespace: platform
