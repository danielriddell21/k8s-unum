apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      # unum web pods — /metrics exposed by promhttp.Handler().
      # Prometheus lives in the platform namespace, so unum targets are
      # addressed cross-namespace as <svc>.unum:8080.
      - job_name: unum-json
        static_configs:
          - targets: ['unum-json.unum:8080']
        metrics_path: /metrics

      - job_name: unum-diff
        static_configs:
          - targets: ['unum-diff.unum:8080']
        metrics_path: /metrics

      - job_name: unum-hash
        static_configs:
          - targets: ['unum-hash.unum:8080']
        metrics_path: /metrics

      - job_name: unum-diagram
        static_configs:
          - targets: ['unum-diagram.unum:8080']
        metrics_path: /metrics

      # OTel Collector — push metrics from CLI/TUI users (same namespace)
      - job_name: otel-collector
        static_configs:
          - targets: ['otel-collector:8889']
