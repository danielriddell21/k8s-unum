# PLACEHOLDER — reseal before/at deploy: `just seal-secrets` → umami-oidc
# (reads Cloudflare Access OIDC creds from Terraform state). Until resealed the
# controller can't decrypt this and umami-sso CrashLoops. See docs/secrets.md.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: umami-oidc
  namespace: platform
spec:
  encryptedData:
    client-id: PLACEHOLDER
    client-secret: PLACEHOLDER
    issuer-url: PLACEHOLDER
    logout-url: PLACEHOLDER
  template:
    metadata:
      name: umami-oidc
      namespace: platform
