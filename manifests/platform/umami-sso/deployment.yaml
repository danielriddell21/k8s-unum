# umami-sso — adds OIDC SSO to Umami (which has no native SSO). Handles
# /login + /logout, authenticates against Cloudflare Access (OIDC), then mints
# an Umami session using UMAMI_APP_SECRET. Fronted by the umami-proxy nginx,
# which routes /login,/logout here and everything else to Umami.
#
# Third-party community image, pinned by digest. It holds Umami's APP_SECRET and
# can mint admin sessions — review before trusting in a sensitive environment.
#
# VERIFY AT DEPLOY:
#   - UMAMI_ADMIN_UUID below is Umami's well-known default admin user_id; confirm
#     it matches `SELECT user_id FROM "user" WHERE username='admin'`.
#   - UMAMI_BASE_URL / UMAMI_LOGOUT_URL behaviour (cookie domain, logout) against
#     the live instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami-sso
  namespace: platform
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: umami-sso
  template:
    metadata:
      labels:
        app: umami-sso
    spec:
      containers:
        - name: umami-sso
          image: codeberg.org/vanutp/umami-sso@sha256:a0a4f88aa94cb209c41feddc7a8de3f5b83c8913f767a6814f4beec845ae57d0
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: UMAMI_BASE_URL
              value: "https://umami.riddellious.dev"
            - name: UMAMI_ADMIN_UUID
              value: "41e2b680-648e-4b09-bcd7-3e2b10c06264"
            - name: UMAMI_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: umami-secret
                  key: app-secret
            - name: UMAMI_OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: umami-oidc
                  key: issuer-url
            - name: UMAMI_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: umami-oidc
                  key: client-id
            - name: UMAMI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: umami-oidc
                  key: client-secret
            - name: UMAMI_LOGOUT_URL
              valueFrom:
                secretKeyRef:
                  name: umami-oidc
                  key: logout-url
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
