apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: unum
data:
  config.yaml: |
    extensions:
      bearertokenauth:
        token: "${OTEL_AUTH_TOKEN}"
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      # External: reached via Cloudflare Tunnel at otel.riddellious.dev
      # Requires Authorization: Bearer <OTEL_AUTH_TOKEN> header.
      otlp/external:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            auth:
              authenticator: bearertokenauth
            max_recv_msg_size_mib: 4

      # Internal: in-cluster unum pods use this directly (no auth needed).
      otlp/internal:
        protocols:
          http:
            endpoint: 0.0.0.0:4319
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
      memory_limiter:
        check_interval: 1s
        limit_mib: 200

    exporters:
      # Traces → Loki (structured event log streams per service/tool/mode).
      loki:
        endpoint: http://loki:3100/loki/api/v1/push
        default_labels_enabled:
          exporter: false
          job: true
        labels:
          attributes:
            service.name: "service_name"
            tool: "tool"
            mode: "mode"
      # Metrics → Prometheus scrape endpoint (Prometheus pulls from :8889).
      prometheus:
        endpoint: 0.0.0.0:8889

    service:
      extensions: [bearertokenauth, health_check]
      pipelines:
        traces:
          receivers: [otlp/external, otlp/internal]
          processors: [memory_limiter, batch]
          exporters: [loki]
        metrics:
          receivers: [otlp/external, otlp/internal]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
