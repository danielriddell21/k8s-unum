apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: unum
data:
  config.yaml: |
    extensions:
      bearertokenauth:
        token: "${OTEL_AUTH_TOKEN}"
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      # External: reached via Cloudflare Tunnel at otel.riddellious.dev
      # Requires Authorization: Bearer <OTEL_AUTH_TOKEN> header.
      otlp/external:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            auth:
              authenticator: bearertokenauth

      # Internal: in-cluster unum pods use this directly (no auth needed).
      otlp/internal:
        protocols:
          http:
            endpoint: 0.0.0.0:4319
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
      memory_limiter:
        check_interval: 1s
        limit_mib: 200

    exporters:
      # Traces → Tempo (persistent trace storage, queryable via Grafana).
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      # Metrics → Prometheus scrape endpoint (Prometheus pulls from :8889).
      prometheus:
        endpoint: 0.0.0.0:8889

    service:
      extensions: [bearertokenauth, health_check]
      pipelines:
        traces:
          receivers: [otlp/external, otlp/internal]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp/external, otlp/internal]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
