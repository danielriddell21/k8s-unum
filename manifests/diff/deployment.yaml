apiVersion: apps/v1
kind: Deployment
metadata:
  name: unum-diff
  namespace: unum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unum-diff
  template:
    metadata:
      labels:
        app: unum-diff
    spec:
      containers:
        - name: unum-diff
          image: ghcr.io/danielriddell21/unum:v0.11.0
          args: ["diff", "--web"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
